<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Profile - Self Introduction</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
            text-align: center;
        }

        .username {
            color: var(--primary);
            font-weight: 600;
            display: block;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .intro-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            min-height: 100px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .intro-placeholder {
            color: var(--text-secondary);
            font-style: italic;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .logout-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome</h1>
        <span class="username" th:text="${user.username}">Username</span>

        <div class="intro-box">
            <p th:if="${user.selfIntroduction != null and !user.selfIntroduction.isEmpty()}"
                th:text="${user.selfIntroduction}">Self Introduction Content</p>
            <p th:unless="${user.selfIntroduction != null and !user.selfIntroduction.isEmpty()}"
                class="intro-placeholder">You haven't added a self-introduction yet.</p>
        </div>

        <a href="/profile/edit" class="btn">Edit Profile</a>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-link"
                style="background:none; border:none; cursor:pointer; width:100%;">Logout</button>
        </form>
    </div>
</body>

</html>
